name: CI

# Runs the tests on pull requests into dev/main, and on pushes to dev/main.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements-serving.txt

      # Install the pinned inference stack plus packages imported by the
      # synthetic model tests. The complete requirements.txt includes heavy
      # orchestration / feature-store dependencies that CI does not need.
      - name: Install test dependencies
        run: |
          python -m pip install -r infra/requirements-serving.txt
          python -m pip install xgboost mlflow pytest

      - name: Run tests
        run: python -m pytest tests -q

      # The model is supplied as a read-only runtime mount. .dockerignore keeps
      # the ignored artifact and private datasets out of this build context.
      - name: Build serving image
        run: docker build --file infra/Dockerfile --tag payguard-api:ci .
